project:
  type: website
  output-dir: docs
  resources:
    - fonts/
    - favicon-*.svg
    - favicon-*.png
    - favicon.ico
    - apple-touch-icon.png
    - og-image.png
    - robots.txt
    - CNAME
    - holidays.js
    - igt.js
    - predict.js
    - alejandro-hinojosa.jpg
    - signature/
    - search.js
    - minisearch.js

website:
  title: "Alejandro Hinojosa"
  site-url: https://alejandrohinojosa.com
  description: "Computational models of decision-making, essays, and The Young Man's Game (Philosophical Fiction)."
  # Link previews (texts, social media): the picture and summary shown when the link is shared
  image: https://alejandrohinojosa.com/og-image.png
  image-alt: "Alejandro Hinojosa, A Website: a curious mind in search of truth"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    title: "Alejandro Hinojosa"
    # The menu bar stays at the top of the screen when you scroll (the name folds into "AH": _brand.html)
    pinned: true
    collapse: false
    right:
      - href: research.qmd
        text: research
      - href: writing.qmd
        text: writing
      - href: recommendations.qmd
        text: recommendations
      - href: about.qmd
        text: about
  page-footer:
    center: "Alejandro Hinojosa · 2026"

filters:
  - baylor.lua

format:
  html:
    theme: styles.scss
    css: fonts.css
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    html-math-method: plain
    include-after-body:
      - _peek.html
      - _brand.html
